.flip:disabled{opacity:.5;cursor:wait;filter:grayscale(.35)}
.note{text-align:center;color:#8f887a;font-size:13px;line-height:1.5;margin:13px 4px 0}

.status{min-height:20px;text-align:center;color:#c5a96c;font-size:13px;margin-top:9px}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:360px){.panel{padding:14px}.stage{height:225px}.coin{width:154px;height:154px}.emblem{width:82px;height:82px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Mafia Guerrera</div>
    <h1>Монетка</h1>
    <div class="subtitle">Один кидок. Одна доля.</div>
  </header>
  <main class="panel">
    <div class="balance"><span>Ваш баланс</span><strong id="balance">— ₲</strong></div>
    <div class="stage">
      <div class="coin" id="coin" style="--end-rotation:2520deg">
        <div class="face front" aria-label="Золота сторона">
          <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 8 58 18 72 15 75 29 88 37 81 50 88 63 75 71 72 85 58 82 50 92 42 82 28 85 25 71 12 63 19 50 12 37 25 29 28 15 42 18Z" fill="#6b4515" stroke="#f7d98e" stroke-width="2"/>
            <path d="M50 24 56 35 69 37 60 47 62 61 50 55 38 61 40 47 31 37 44 35Z" fill="#f4d995" stroke="#704918" stroke-width="2"/>

            <path d="M50 47 55 55 50 63 45 55Z" fill="#f5d88e"/>

          </svg>

          <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 13c-19 0-32 14-32 32 0 13 7 22 17 28v9h30v-9c10-6 17-15 17-28 0-18-13-32-32-32Z" fill="#e8edf0" stroke="#34404a" stroke-width="3" stroke-linejoin="round"/>
            <path d="M35 46c0-6 4-10 9-10s9 4 9 10-4 10-9 10-9-4-9-10Zm22 0c0-6 4-10 9-10s9 4 9 10-4 10-9 10-9-4-9-10Z" fill="#39444d"/>
            <path d="m50 52-7 12h14Z" fill="#39444d"/>
            <path d="M42 69v9m8-9v9m8-9v9" stroke="#39444d" stroke-width="3" stroke-linecap="round"/>
            <path d="m25 25 50 50m0-50L25 75" stroke="#f3f6f7" stroke-width="4" stroke-linecap="round" opacity=".0"/>
            <path d="m23 76 54-52M23 24l54 52" stroke="#e8edf0" stroke-width="5" stroke-linecap="round"/>
            <path d="m23 76 54-52M23 24l54 52" stroke="#34404a" stroke-width="2" stroke-linecap="round"/>
          </svg>

    <div class="presets">
      <button class="preset" data-value="1">1</button>
      <button class="preset selected" data-value="10">10</button>
      <button class="preset" data-value="25">25</button>
      <button class="preset" data-value="50">50</button>

  <div class="bottom">

<audio id="spinSound" preload="auto" src="https://mskrypynets-ai.github.io/mafia-cabinet/coin_spin.mp3"></audio>
<audio id="fallSound" preload="auto" src="https://mskrypynets-ai.github.io/mafia-cabinet/coin_fall.mp3"></audio>
<audio id="winSound" preload="auto" src="https://mskrypynets-ai.github.io/mafia-cabinet/coin_win.mp3"></audio>
<audio id="landSound" preload="auto" src="https://mskrypynets-ai.github.io/mafia-cabinet/coin_land.mp3"></audio>

<script>
(() => {
  'use strict';

  const API = 'https://guerrera.duckdns.org:8888';
  // Персональний токен передається кнопкою Telegram у фрагменті URL.
  const coinToken = new URLSearchParams(window.location.hash.slice(1)).get('token') || '';
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (_) {} }

  const $ = id => document.getElementById(id);
  const coin = $('coin'), balanceEl = $('balance'), statusEl = $('status');
  const flipBtn = $('flipBtn'), stakeEl = $('stake'), resultEl = $('result');
  const sounds = ['spinSound','fallSound','winSound','landSound'].map($);

  let selectedSide = 'gold';
  let busy = false;
  let muted = false;
  let fallTimer = null;
  let fallStopTimer = null;

  try { muted = localStorage.getItem('mg_coin_muted') === '1'; } catch (_) {}

  function money(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n.toLocaleString('uk-UA', {maximumFractionDigits:2}) : '—';
  }

  function setBalance(value) {
    balanceEl.textContent = money(value) + ' ₲';
  }

  function say(message) {
    statusEl.textContent = message || '';
  }

  function sound(id, volume=1) {
    if (muted) return;
    const audio = $(id);
    try {
      audio.pause();
      audio.currentTime = 0;
      audio.volume = volume;
      const playPromise = audio.play();
      if (playPromise && playPromise.catch) playPromise.catch(() => {});
    } catch (_) {}
  }

  function stopSounds() {
    sounds.forEach(audio => {
      try { audio.pause(); audio.currentTime = 0; } catch (_) {}
    });
  }

  function clearFallTimers() {
    if (fallTimer !== null) clearTimeout(fallTimer);
    if (fallStopTimer !== null) clearTimeout(fallStopTimer);
    fallTimer = null;
    fallStopTimer = null;
  }

  function setSide(side) {
    selectedSide = side;
    $('goldBtn').classList.toggle('active', side === 'gold');
    $('silverBtn').classList.toggle('active', side === 'silver');
    $('goldBtn').setAttribute('aria-pressed', String(side === 'gold'));
    $('silverBtn').setAttribute('aria-pressed', String(side === 'silver'));

    if (!busy) {
      coin.classList.remove('spinning');
      coin.style.transform = 'rotateY(0deg)';
      coin.classList.toggle('show-silver', side === 'silver');
      coin.style.setProperty('--end-rotation', side === 'gold' ? '2520deg' : '2700deg');
    }

    $('stageCaption').textContent = side === 'gold' ? 'Ваша ставка — золото' : 'Ваша ставка — срібло';
  }

  $('goldBtn').addEventListener('click', () => { if (!busy) setSide('gold'); });
  $('silverBtn').addEventListener('click', () => { if (!busy) setSide('silver'); });

  document.querySelectorAll('.preset').forEach(btn => {
    btn.addEventListener('click', () => {
      if (busy) return;
      stakeEl.value = btn.dataset.value;
      document.querySelectorAll('.preset').forEach(x => x.classList.toggle('selected', x === btn));
    });
  });

  stakeEl.addEventListener('input', () => {
    document.querySelectorAll('.preset').forEach(x => {
      x.classList.toggle('selected', Number(x.dataset.value) === Number(stakeEl.value));
    });
  });

  function requestId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  }

  async function loadBalance() {
    try {
      let response;

      if (coinToken) {
        response = await fetch(`${API}/coin-balance`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token: coinToken}),
          cache: 'no-store'
        });
      } else {
        // Резервний режим для тимчасового тесту через Telegram initData.
        const userId = tg?.initDataUnsafe?.user?.id;
        if (!userId) {
          balanceEl.textContent = 'У Telegram';
          return;
        }
        response = await fetch(`${API}/cabinet-data?user_id=${encodeURIComponent(userId)}`, {
          method: 'GET',
          cache: 'no-store'
        });
      }

      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || 'Помилка балансу');
      setBalance(data.bal);
    } catch (_) {
      balanceEl.textContent = 'Недоступно';
    }
  }

  function showResult(data) {
    const sideName = data.result === 'gold' ? 'ЗОЛОТО' : 'СРІБЛО';
    resultEl.className = 'result show ' + (data.won ? 'win' : 'loss');
    $('resultTitle').textContent = data.won ? 'ВИ ПЕРЕМОГЛИ' : 'ЦЬОГО РАЗУ НЕ ВДАЛОСЯ';
    $('resultDetails').textContent =
      `Випало: ${sideName} · Ставка: ${data.stake} ₲ · ` +
      `${data.won ? 'Виплата: ' + data.payout + ' ₲' : 'Втрачено: ' + data.stake + ' ₲'} · ` +
      `Баланс: ${money(data.balance)} ₲`;
  }

  async function toss() {
    if (busy) return;

    const stake = Number(stakeEl.value);
    if (!Number.isInteger(stake) || stake < 1 || stake > 100) {
      say('Вкажіть цілу ставку від 1 до 100 ₲.');
      stakeEl.focus();
      return;
    }

    if (!coinToken && (!tg || !tg.initData || !tg.initDataUnsafe?.user?.id)) {
      say('Відкрийте Монетку через кнопку в Telegram-боті.');
      return;
    }

    busy = true;
    flipBtn.disabled = true;
    flipBtn.textContent = 'МОНЕТКА У ПОВІТРІ…';
    resultEl.className = 'result';
    say('Підкидаємо монетку…');

    clearFallTimers();
    stopSounds();
    sound('spinSound', .8);

    coin.classList.remove('spinning');
    coin.style.transform = 'rotateY(0deg)';
    void coin.offsetWidth;

    try {
      const response = await fetch(`${API}/coin-flip`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          initData: tg?.initData || '',
          token: coinToken,
          request_id: requestId(),
          chosen_side: selectedSide,
          stake
        })
      });

      const data = await response.json();

      if (!response.ok || !data.ok) {
        clearFallTimers();
        stopSounds();

        if (data.error === 'insufficient_funds') say('Недостатньо dineros для цієї ставки.');
        else if (data.error === 'unauthorized') say('Посилання Монетки недійсне. Натисніть /start у боті, щоб оновити кнопку.');
        else if (data.error === 'banned') say('Ваш акаунт не може грати в Монетку.');
        else say(data.error || 'Не вдалося виконати кидок. Спробуйте ще раз.');

        if (typeof data.balance === 'number') setBalance(data.balance);
        else await loadBalance();
        return;
      }

      const finalRotation = data.result === 'gold' ? 2520 : 2700;
      coin.style.setProperty('--end-rotation', finalRotation + 'deg');
      coin.classList.add('spinning');

      // Анімація: 2450 мс. Звук падіння: старт на 1550 мс,
      // обрізання через 600 мс, щоб він завершився до приземлення.
      fallTimer = setTimeout(() => {
        sound('fallSound', .65);
        fallStopTimer = setTimeout(() => {
          const fall = $('fallSound');
          try { fall.pause(); fall.currentTime = 0; } catch (_) {}
          fallStopTimer = null;
        }, 600);
        fallTimer = null;
      }, 1550);

      await new Promise(resolve => {
        coin.addEventListener('animationend', resolve, {once: true});
      });

      clearFallTimers();
      stopSounds();
      sound('landSound', .9);
      if (data.won) setTimeout(() => sound('winSound', .9), 180);

      coin.style.transform = 'rotateY(0deg)';
      coin.classList.toggle('show-silver', data.result === 'silver');
      setBalance(data.balance);
      showResult(data);
      $('stageCaption').textContent = data.result === 'gold' ? 'Випало золото' : 'Випало срібло';
      say(data.won ? 'Доля сьогодні на вашому боці.' : 'Спробуйте удачу наступного разу.');

    } catch (err) {
      clearFallTimers();
      stopSounds();
      say('Помилка з’єднання із сервером. Перевірте баланс перед повторною ставкою.');
      await loadBalance();
    } finally {
      busy = false;
      flipBtn.disabled = false;
      flipBtn.textContent = 'ПІДКИНУТИ МОНЕТКУ';
    }
  }

  flipBtn.addEventListener('click', toss);

  $('muteBtn').addEventListener('click', () => {
    muted = !muted;
    $('muteBtn').textContent = muted ? '♫ Звук: вимкнено' : '♫ Звук: увімкнено';
    try { localStorage.setItem('mg_coin_muted', muted ? '1' : '0'); } catch (_) {}
    if (muted) {
      clearFallTimers();
      stopSounds();
    }
  });

  $('muteBtn').textContent = muted ? '♫ Звук: вимкнено' : '♫ Звук: увімкнено';
  loadBalance();
})();
</script>
